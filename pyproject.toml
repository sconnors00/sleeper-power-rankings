[project]
name = "ffpr"
version = "0.1.0"
description = "Sleeper fantasy football power rankings static site generator"
authors = [
    { name = "scone", email = "sean@scone.us" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.scripts]
ffpr = "ffpr.cli:app"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
