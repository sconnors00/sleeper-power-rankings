name: Build and deploy site

on:
  schedule:
    # Tuesday ~3:11am America/New_York. GitHub Actions cron is UTC-only, so
    # this drifts by an hour across the DST boundary (~3:11am EDT / ~2:11am
    # EST). Deliberately off the top of the hour: GitHub queues every ":00"
    # cron at once and this build once waited 4h20m behind that backlog.
    # The second entry is a backstop for a first run GitHub drops outright;
    # a rebuild is idempotent, so the duplicate is a cheap no-op.
    - cron: "11 7 * * 2"
    - cron: "11 11 * * 2"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Past seasons' raw responses never change, so carry the cache between
      # runs (the current season is always refetched, and the ~13 MB players
      # map at most daily); restore-keys lets each run reuse the last entry.
      - uses: actions/cache@v4
        with:
          path: data
          key: sleeper-data-${{ github.run_id }}
          restore-keys: |
            sleeper-data-
      - run: cargo build --release
      - run: ./target/release/ffpr build --provisional
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
