name: Build and deploy site

on:
  schedule:
    # Tuesday ~7:40am America/New_York. GitHub Actions cron is UTC-only, so
    # this drifts by an hour across the DST boundary (~7:40am EDT / ~6:40am
    # EST). Deliberately off the top of the hour: GitHub queues every ":00"
    # cron at once and this build once waited 4h20m behind that backlog.
    # The second entry is a backstop for a first run GitHub drops outright;
    # a rebuild is idempotent, so the duplicate is a cheap no-op.
    - cron: "41 11 * * 2"
    - cron: "41 15 * * 2"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # Completed weeks and the ~5 MB players map never change, so carry the
      # raw-response cache between runs; restore-keys lets a new week reuse
      # last week's entry and only fetch what's new.
      - uses: actions/cache@v4
        with:
          path: data
          key: sleeper-data-${{ github.run_id }}
          restore-keys: |
            sleeper-data-
      - run: uv sync
      - run: uv run ffpr build --provisional
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - run: |
          uv run python -c "
          import re, html as H
          def txt(s): return H.unescape(re.sub(r'<[^>]+>', ' ', s)).split()
          s = open('site/season.html').read()
          if 'id=\"playoff-odds\"' in s:
              sec = s.split('id=\"playoff-odds\"')[1].split('</section>')[0]
              rows = sec.split('<tr>')[2:]
              print('DIAG odds rows:', len(rows))
              print('DIAG odds note:', ' '.join(txt(sec.split('</p>')[0]))[:200])
              for r in rows[:3] + rows[-2:]: print('DIAG  ', ' '.join(txt(r)))
          else:
              print('DIAG odds: MISSING')
          for sid in ('pickups', 'trades'):
              print(f'DIAG {sid}:', 'present' if f'id=\"{sid}\"' in s else 'absent')
          if 'id=\"pickups\"' in s:
              sec = s.split('id=\"pickups\"')[1].split('</section>')[0]
              print('DIAG  top pickup:', ' '.join(txt(sec.split('<tr>')[2])))
          print('DIAG lineup leaderboard:', 'present' if '<h2>Lineup efficiency</h2>' in s else 'absent')
          idx = open('site/index.html').read()
          m = re.search(r'Costliest lineup call</h3>(.*?)</div>', idx, re.S)
          print('DIAG costliest:', ' '.join(txt(m.group(1))) if m else 'none')
          r = open('site/rivalries.html').read()
          print('DIAG rivalries managers:', r.count('<details class=\"rivalry\">'))
          print('DIAG rivalry cards:', ' | '.join(' '.join(txt(c)) for c in re.findall(r'<div class=\"award-card[^\"]*\">(.*?)</div>', r, re.S)))
          "

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
