name: Build and deploy site

on:
  schedule:
    # Tuesday ~7am America/New_York. GitHub Actions cron is UTC-only, so
    # this drifts by an hour across the DST boundary (~7am EDT / ~6am EST).
    - cron: "0 11 * * 2"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # Completed weeks and the ~5 MB players map never change, so carry the
      # raw-response cache between runs; restore-keys lets a new week reuse
      # last week's entry and only fetch what's new.
      - uses: actions/cache@v4
        with:
          path: data
          key: sleeper-data-${{ github.run_id }}
          restore-keys: |
            sleeper-data-
      - run: uv sync
      - run: |
          uv run python -c "
          import json, os, httpx
          lid = os.environ['SLEEPER_LEAGUE_ID']
          state = httpx.get('https://api.sleeper.app/v1/state/nfl').json()
          season = state['season']
          print('state:', {k: state.get(k) for k in ('season','season_type','week','display_week','leg')})
          for wk in (1, 2):
              live = httpx.get(f'https://api.sleeper.app/v1/league/{lid}/matchups/{wk}').json()
              print(f'FRESH  week {wk}:', sorted((m['roster_id'], m.get('points')) for m in live))
              p = f'data/{season}/raw/matchups_week{wk}.json'
              if os.path.exists(p):
                  c = json.load(open(p))
                  print(f'CACHED week {wk}:', sorted((m['roster_id'], m.get('points')) for m in c))
              else:
                  print(f'CACHED week {wk}: (no cache file)')
          "
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
      - run: uv run ffpr build --provisional
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
