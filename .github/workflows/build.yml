name: Build and deploy site

on:
  schedule:
    # Tuesday ~7:40am America/New_York. GitHub Actions cron is UTC-only, so
    # this drifts by an hour across the DST boundary (~7:40am EDT / ~6:40am
    # EST). Deliberately off the top of the hour: GitHub queues every ":00"
    # cron at once and this build once waited 4h20m behind that backlog.
    # The second entry is a backstop for a first run GitHub drops outright;
    # a rebuild is idempotent, so the duplicate is a cheap no-op.
    - cron: "41 11 * * 2"
    - cron: "41 15 * * 2"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # Completed weeks and the ~5 MB players map never change, so carry the
      # raw-response cache between runs; restore-keys lets a new week reuse
      # last week's entry and only fetch what's new.
      - uses: actions/cache@v4
        with:
          path: data
          key: sleeper-data-${{ github.run_id }}
          restore-keys: |
            sleeper-data-
      - run: uv sync
      - run: uv run ffpr build --provisional
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - run: |
          uv run python -c "
          import json, os, httpx
          lid = os.environ['SLEEPER_LEAGUE_ID']
          state = httpx.get('https://api.sleeper.app/v1/state/nfl').json()
          season = state['season']
          for wk in (1, 2, 3):
              live = httpx.get(f'https://api.sleeper.app/v1/league/{lid}/transactions/{wk}').json()
              lc = sum(1 for t in live if t.get('status') == 'complete')
              print(f'DIAG tx week {wk}: FRESH total={len(live)} complete={lc}')
              p = f'data/{season}/raw/transactions_week{wk}.json'
              if os.path.exists(p):
                  c = json.load(open(p))
                  cc = sum(1 for t in c if t.get('status') == 'complete')
                  print(f'DIAG tx week {wk}: CACHED total={len(c)} complete={cc}')
              else:
                  print(f'DIAG tx week {wk}: CACHED (no cache file)')
          for wk in (1, 2):
              h = open(f'site/weeks/week-{wk}.html').read()
              print(f'DIAG week-{wk}.html has Roster moves section:', 'Roster moves' in h, '| added rows:', h.count('move-add'))
          "
        env:
          SLEEPER_LEAGUE_ID: ${{ secrets.SLEEPER_LEAGUE_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
