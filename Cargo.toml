[package]
name = "ffpr"
version = "0.2.0"
edition = "2021"
description = "Sleeper fantasy football power rankings static site generator"
default-run = "ffpr"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
tiny_http = "0.12"
toml = "0.8"
ureq = "2"

[dev-dependencies]
tempfile = "3"
