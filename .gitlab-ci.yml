image: python:3.12-slim

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

cache:
  paths:
    - .uv-cache/

# Modern GitLab Pages syntax (GitLab >= 17.1): `pages: true` + `publish:`.
# If this GitLab instance is older, rename this job to `pages`, drop the
# `pages:`/`publish:` keys, and add a step to `cp -r site public` instead --
# see the commented job below.
build-and-publish:
  stage: deploy
  pages: true
  publish: site
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl > /dev/null
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - uv sync
    - uv run ffpr build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

